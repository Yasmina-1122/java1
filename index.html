        // Методы pop/push, shift/unshift
        let fruits = ["Яблоко", "Апельсин", "Груша", "Банан"];
        console.log(fruits);

        // push() - добавляет элемент в конец массива
        fruits.push("киви")
        console.log(fruits);


        // pop() - добавляет элемент с конца массива
        fruits.pop()
        console.log(fruits);

        // unshift() - добавляет элемент в начало массива
        fruits.unshift("киви")
        console.log(fruits);

        // shift() - удаляет элемент с начало массива 
        fruits.shift()
        console.log(fruits);

        fruits.push("мерседес")
        console.log(fruits);
